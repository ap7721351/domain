<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rangkuman materi pertemuan pertama tentang domain, hosting, dan website.">
    <title>Tugas 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
            line-height: 1.7;
        }

        .hero {
            display: grid;
            min-height: 270px;
            place-items: center;
            padding: 40px 24px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed, #9333ea);
            color: white;
            text-align: center;
        }

        .hero-content {
            max-width: 760px;
        }

        .eyebrow {
            margin-bottom: 12px;
            color: #ddd6fe;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .hero h1 {
            margin-bottom: 12px;
            font-size: 36px;
            line-height: 1.15;
        }

        .hero p {
            font-size: 18px;
        }

        main {
            width: min(100% - 40px, 960px);
            margin: 0 auto;
            padding: 58px 0 72px;
        }

        .overview {
            margin-bottom: 28px;
            padding: 28px 32px;
            border-left: 5px solid #4f46e5;
            border-radius: 10px;
            background: white;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .overview h2,
        .section-title {
            margin-bottom: 12px;
            color: #4f46e5;
            font-size: 25px;
            line-height: 1.3;
        }

        .overview p,
        .topic p {
            color: #555;
        }

        .topics {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin: 28px 0;
        }

        .topic {
            display: grid;
            grid-template-columns: 36px minmax(0, 1fr);
            align-items: center;
            column-gap: 12px;
            padding: 24px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .topic-number {
            display: inline-grid;
            width: 36px;
            height: 36px;
            place-items: center;
            border-radius: 50%;
            background: #eef2ff;
            color: #4f46e5;
            font-weight: bold;
        }

        .topic h3 {
            margin: 0;
            color: #4f46e5;
            font-size: 19px;
        }

        .topic p {
            grid-column: 1 / -1;
            margin-top: 12px;
        }

        .flow {
            margin-top: 18px;
            padding: 22px 26px;
            border-radius: 10px;
            background: #eef2ff;
            color: #3730a3;
            font-weight: bold;
            text-align: center;
        }

        .back-link {
            display: inline-block;
            margin-top: 28px;
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        footer {
            padding: 24px;
            background: #1e1b4b;
            color: white;
            text-align: center;
        }

        @media (max-width: 700px) {
            .hero {
                min-height: 220px;
                padding: 32px 20px;
            }

            .hero h1 {
                font-size: 30px;
            }

            .hero p {
                font-size: 16px;
            }

            main {
                width: min(100% - 32px, 960px);
                padding: 40px 0 54px;
            }

            .topics {
                grid-template-columns: 1fr;
            }

            .overview {
                padding: 23px;
            }
        }
    </style>
</head>

<body>
    <header class="hero">
        <div class="hero-content">
            <p class="eyebrow">Tugas 3 · Mata Kuliah TTI</p>
            <h1>Rangkuman Materi 3</h1>
        </div>
    </header>
    <main>
         <h2 class="section-title">Materi Utama</h2>
        <div class="topics">
            <article class="topic">
                <span class="topic-number">1</span>
                 <h3>Pengertian dan Perkembangan Internet</h3>
                 <p>tes</p>

</div>
         <a class="back-link" href="index.html#tugas">&larr; Kembali ke daftar tugas</a>
    </main>

    <footer>
        <p>&copy; 2026 MyWebsite. Dibuat dengan HTML.</p>
    </footer>
</body>
</html>
